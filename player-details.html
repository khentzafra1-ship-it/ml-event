<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Details - ML Event Demo</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/player-details.css">
</head>

<body>

    <header class="header">

        <div class="brand">
            <img src="images/ml.png" alt="Mobile Legends" class="logo">
        </div>

        <button class="menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <main class="details-page">

        <div class="back-button" onclick="location.href='select-reward.html'">

            ‹ BACK

        </div>


        <section class="details-header">

            <div class="title-decoration">◆</div>

            <small>EVENT REWARD</small>

            <h1>
                PLAYER
                <span>DETAILS</span>
            </h1>

            <p>
                Enter your player information to continue
                with this reward.
            </p>

        </section>


        <!-- SELECTED REWARD -->

        <section class="selected-box">

            <div class="selected-icon">
                ◆
            </div>

            <div>

                <small>SELECTED REWARD</small>

                <h2 id="rewardName">
                    Loading...
                </h2>

            </div>

        </section>


        <!-- FORM -->

        <form id="playerForm">


            <!-- Hidden reward -->

            <input type="hidden" name="reward_name" id="rewardInput">


            <div class="form-group">
                <label for="userId">USER ID</label>
                <input type="text" id="userId" maxlength="10" inputmode="numeric" placeholder="Enter User ID" required>
            </div>

            <div class="form-group">
                <label for="zoneId">ZONE ID</label>
                <input type="text" id="zoneId" maxlength="4" inputmode="numeric" placeholder="Enter Zone ID" required>
            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input type="email" id="email" placeholder="Enter your email" required>



            </div>


            <!-- NOTICE -->

            <div class="privacy-notice">

                <div class="notice-icon">
                    !
                </div>

                <p>
                    Please Enter your Right User ID and Zone ID
                </p>

            </div>


            <!-- SUBMIT -->

            <button type="submit" id="continueBtn" disabled style="
        width: 100%;
        height: 56px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: #222;
        color: #666;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: not-allowed;
        appearance: none;
        -webkit-appearance: none;
        transition: 0.25s ease;
    ">
                <span>CONTINUE</span>

                <b style="
            font-size: 24px;
            font-weight: 400;
            line-height: 1;
        ">›</b>
            </button>


        </form>




    </main>


    <footer>

        <img src="images/mobile.png" alt="Mobile Legends">

        <span>
            © Moonton
        </span>


    </footer>


    <script src="js/modal.js"></script>
    <script src="js/player-details.js"></script>

</body>

</html>
