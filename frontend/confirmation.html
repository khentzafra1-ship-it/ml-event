<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirm Claim</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .confirmation-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirmation-card {
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
        }

        .confirmation-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .confirmation-subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .details-box {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #292929;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
        }

        .detail-value {
            font-weight: 700;
            text-align: right;
            word-break: break-word;
        }

        .warning {
            background: rgba(255, 193, 7, 0.08);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #d8b85a;
            padding: 14px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .confirm-button,
        .back-button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .confirm-button {
            background: #1877f2;
            color: white;
        }

        .confirm-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-button {
            background: #222;
            color: #ddd;
            border: 1px solid #333;
        }
    </style>
</head>

<body>

    <div class="confirmation-page">

        <div class="confirmation-card">

            <h1 class="confirmation-title">
                CONFIRM CLAIM
            </h1>

            <p class="confirmation-subtitle">
                Please review your information before continuing.
            </p>

            <div class="details-box">

                <div class="detail-row">
                    <span class="detail-label">Reward</span>
                    <span class="detail-value" id="rewardName">—</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">User ID</span>
                    <span class="detail-value" id="mlUserId">—</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Zone ID</span>
                    <span class="detail-value" id="serverId">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email</span>
                    <span class="detail-value" id="email">—</span>
                </div>

            </div>

            <div class="warning">
                <strong>Important:</strong>
                Please Double Check the Account you Register
            </div>

            <div class="button-group">

                <button type="button" class="confirm-button" id="confirmButton">
                    CONFIRM CLAIM
                </button>

                <a href="player-details.html" class="back-button">
                    EDIT INFORMATION
                </a>

            </div>

        </div>

    </div>

    <script src="js/modal.js"></script>
    <script src="js/confirmation.js"></script>

</body>

</html>
