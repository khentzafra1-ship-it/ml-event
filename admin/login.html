<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0d1324;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #151d32;
            border: 1px solid #29344e;
            border-radius: 14px;
            padding: 30px;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #8d96aa;
            margin-top: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #aeb6c7;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0d1324;
            border: 1px solid #34405c;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #287ff0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #287ff0;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 80, 80, .1);
            border: 1px solid rgba(255, 80, 80, .3);
            color: #ff7777;
            font-size: 13px;
        }

        .notice {
            margin-top: 20px;
            color: #68738a;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1 class="title">ADMIN LOGIN</h1>

    <p class="subtitle">
        Claim Management
    </p>

    <div class="error" id="errorMessage"></div>

    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

        </div>

        <button type="submit" id="loginButton">
            LOGIN
        </button>

    </form>

    <p class="notice">
        Authorized administrators only.
    </p>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const errorMessage = document.getElementById("errorMessage");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    errorMessage.style.display = "none";

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    try {

        const response = await fetch(
            "../../backend/admin/login.php",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const result = await response.json();

        if (result.success) {

            window.location.href = "claims.html";

        } else {

            errorMessage.textContent =
                result.message || "Invalid login.";

            errorMessage.style.display = "block";

            button.disabled = false;
            button.textContent = "LOGIN";
        }

    } catch (error) {

        console.error(error);

        errorMessage.textContent =
            "Unable to connect to the server.";

        errorMessage.style.display = "block";

        button.disabled = false;
        button.textContent = "LOGIN";
    }

});

</script>

</body>
</html>
